version: 3

# Small falsifiable first pilot: ten new adventures across source-length strata.
# Completely unscored qualified-dimension rows are preferred rather than filling
# random holes across the whole catalog.
pack_count: 1
adventures_per_pack: 10

# Long source bodies are intentionally deferred from idle/background compute
# until the queue mechanism is proven reliable.
max_page_count: 160
# max_page_count: 60

# Require every qualified dimension marked as a selection gate to be blank in
# the AMC. Catalog dimensions such as Levels may already be populated without
# disqualifying an otherwise untouched adventure; those operations are emitted
# only when all of their mapped AMC output cells are blank.
require_zero_qualified_scores: true

# Adventures already present in any checked-in production case index, or in
# local completed/failed/running output metadata, are excluded from selection.
exclude_reserved_production_adventures: true

# Sample across source lengths instead of filling the queue with the shortest
# available adventures. Weights 2:3:3:2 produce exact 2/3/3/2 quotas for a
# ten-adventure pilot and preserve the same proportions when later queues scale.
selection_strategy: stratified_page_count_source_diverse
page_strata:
  # Runnable 1-2 page production pool exhausted after backlog 006.
  - name: 1-2-pages
    min_pages: 1
    max_pages: 2
    weight: 0

  # Exhaust remaining runnable production inventory through 160 pages.
  - name: 3-10-pages
    min_pages: 3
    max_pages: 10
    weight: 16

  - name: 11-30-pages
    min_pages: 11
    max_pages: 30
    weight: 11

  - name: 31-60-pages
    min_pages: 31
    max_pages: 60
    weight: 4

  - name: 61-160-pages
    min_pages: 61
    max_pages: 160
    weight: 3

max_source_share: 0.35

# Source availability must be proven with scorer --preflight before selection.
require_source_preflight: true
