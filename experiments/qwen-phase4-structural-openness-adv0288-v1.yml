name: qwen-phase4-structural-openness-adv0288-v1

purpose: >
  Run a differentiated Phase-4 Structural Openness discriminator on ADV-0288
  using Qwen 3.6 35B-A3B.

dispatch: pool

models:
  - qwen

dimension: Structural Openness

adventures:
  - ADV-0288

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - The scorer cannot complete the assessment.
