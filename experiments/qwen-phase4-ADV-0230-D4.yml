name: qwen-phase4-puzzle-adv0230-v1

purpose: >
  Run the Phase-4 Puzzle / Problem-Solving Emphasis discriminator on ADV-0230
  using Qwen 3.6 35B-A3B.

dispatch: pool

models:
  - qwen

dimension: Puzzle / Problem-Solving Emphasis

adventures:
  - ADV-0230

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - The scorer cannot complete the assessment.

cost_cap_usd: 0.01
