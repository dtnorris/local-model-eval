name: alternate-ollama-smoke-v1

purpose: >
  Verify that local-model-eval can route af-cli-scoring-utility
  inference to a non-default Ollama endpoint.

dispatch: pool

models:
  - qwen

dimension: Exploration Emphasis

adventures:
  - ADV-0230

replicates: 1

workers:
  - mac_alt

required_worker_labels:
  - alternate-endpoint

scorer:
  repo: ../../af-cli-scoring-utility
  mode: regression
  extra_args: []

success_criteria:
  - One scoring job completes successfully.
  - Run metadata identifies mac_alt.
  - The scorer uses Ollama at port 11435 rather than the default 11434.

stop_conditions:
  - Worker check fails.
  - Model is unavailable on the alternate endpoint.
  - Scoring fails because the scorer ignores AF_OLLAMA_BASE_URL.
