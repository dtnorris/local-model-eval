name: qwen-phase4-seriousness-adv0040-v1

purpose: >
  Run a differentiated Phase-4 Seriousness discriminator on ADV-0040
  using Qwen 3.6 35B-A3B.

dispatch: pool

models:
  - qwen

dimension: Seriousness

adventures:
  - ADV-0040

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - The scorer cannot complete the assessment.
