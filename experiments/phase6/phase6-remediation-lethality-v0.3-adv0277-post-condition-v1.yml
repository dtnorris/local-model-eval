name: phase6-remediation-lethality-v0.3-adv0277-post-condition-v1
purpose: >
  Phase-6 local-only Lethality v0.3 topology discriminator P6-LETH-V03-01. Score
  exactly one frozen adventure on exactly one dimension with one Qwen replicate
  under the declared experimental prompt profile. Oracle metadata is for
  post-run adjudication only and must never be exposed to scorer input.
dispatch: pool

models:
  - qwen

dimension: Lethality / Failure Severity

adventures:
  - ADV-0277

replicates: 1

workers:
  - mac

required_worker_labels:
  - local

scorer:
  repo: ../../../af-cli-scoring-utility
  mode: positional
  extra_args: []

phase6_contract:
  pilot_case_id: P6-LETH-V03-01
  pilot_source: phase6_lethality_topology_pilot_v0.1.md
  sequence: 1
  role: literal-post-failure-state-semantics
  model_alias: qwen
  ollama_model: qwen3.6:35b-a3b
  prompt_profile:
    version: phase6-v0.3
    env_name: AF_LETHALITY_GUARDRAIL_PROFILE
    env_value: phase6-v0.3
  case:
    adventure_id: ADV-0277
    adventure_title: "The Wild Beyond the Witchlight"
  oracle:
    source: frozen-afao-calibration
    score: 2
    visibility: post-run-adjudication-only
  replicate_count: 1
  diagnostic_completion:
    complete_all_authorized_cases: true
    score_triggered_stop: false
    systemic_integrity_failure_only: true
  no_favorable_rerun: true
  external_api_cost_usd: 0.0

success_criteria:
  - Structured scorer output validates and remains grounded to the canonical source unit.
  - Apply the oracle only after inference; the accepted score must not enter scorer input.
  - Preserve the single attempted inference and do not rerun for a favorable score.
  - Adjudicate the case-specific semantic falsification check from the frozen pilot specification.

stop_conditions:
  - Do not stop remaining authorized cases merely because this case is numerically unfavorable or fails its semantic falsification check.
  - Pause only for a systemic experiment-integrity failure that could invalidate later calls.
  - Do not rerun a completed or attempted inference to seek a more favorable sample.

cost_cap_usd: 0.01
