name: 29-qwen-sessions-adv0262-scaling-control-v1

purpose: >
  Conditional follow-up to experiment 09. If Qwen survives the short-duration
  No Honour Among Thieves control, test duration scaling using ADV-0262
  Lost Mine of Phandelver.

dispatch: pool

models:
  - qwen

dimension: "# of Sessions"

adventures:
  - ADV-0262

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Experiment 09 survived its discriminator.
  - Structured output validates and is grounded to the ADV-0262 canonical source unit.
  - Normalized Sessions 10 => CONTROL_MATCH.
  - Normalized Sessions from 8 through 12 => PRACTICAL_AGREEMENT_REQUIRES_REVIEW.
  - No target-specific expected-session contamination is used in the assessment.

stop_conditions:
  - Do not execute if experiment 09 failed its discriminator.
  - Normalized Sessions is 5 or less, or 15 or greater; classify as a serious scaling failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned scaling-control run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
