name: 13-qwen-darkness-adv0287-upper-endpoint-v1

purpose: >
  Test whether Qwen 3.6 35B-A3B's known Darkness / Horror downward
  boundary tendency persists at the extreme horror endpoint using
  ADV-0287 House of Lament.

dispatch: pool

models:
  - qwen

dimension: Darkness / Horror Intensity

adventures:
  - ADV-0287

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0287 canonical source unit.
  - Proposed Darkness / Horror Intensity 5 => ENDPOINT_MATCH.
  - Proposed Darkness / Horror Intensity 4 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Darkness / Horror Intensity is 1, 2, or 3; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
