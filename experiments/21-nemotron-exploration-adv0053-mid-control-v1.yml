name: 21-nemotron-exploration-adv0053-mid-control-v1

purpose: >
  Conditional follow-up to the Nemotron Exploration audition. Run only if
  experiment 01 survived. Test ADV-0053 Call of the Wild as a clean
  Exploration Emphasis middle anchor after low- and high-side evidence.

dispatch: pool

models:
  - nemotron

dimension: Exploration Emphasis

adventures:
  - ADV-0053

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Experiment 01 survived its discriminator.
  - Structured output validates and is grounded to the ADV-0053 canonical source unit.
  - Proposed Exploration Emphasis 3 => CONTROL_MATCH.
  - Proposed Exploration Emphasis 2 or 4 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Do not execute if experiment 01 failed its discriminator.
  - Proposed Exploration Emphasis is 1 or 5; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned control run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
