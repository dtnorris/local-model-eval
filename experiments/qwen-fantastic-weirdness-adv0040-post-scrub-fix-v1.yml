name: qwen-fantastic-weirdness-adv0040-post-scrub-fix-v1

purpose: >
  Re-run the Phase-4 Fantastic Weirdness discriminator for ADV-0040 Expedition
  to the Barrier Peaks after hardening AFAO target-reference scrubbing. This
  supersedes the earlier contaminated run and provides clean post-fix evidence.

dispatch: pool

models:
  - qwen

dimension: Fantastic Weirdness

adventures:
  - ADV-0040

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.
  - No target-specific AFAO calibration material survives into the scoring prompt.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - Target-specific calibration material is observed in the scoring context.
  - The scorer cannot complete the assessment.
