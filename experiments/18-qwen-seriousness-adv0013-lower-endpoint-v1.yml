name: 18-qwen-seriousness-adv0013-lower-endpoint-v1

purpose: >
  Test Qwen 3.6 35B-A3B against the playful Seriousness endpoint
  using ADV-0013 A Conspiracy Most Cracked, providing a strong
  check against upward Seriousness drift.

dispatch: pool

models:
  - qwen

dimension: Seriousness

adventures:
  - ADV-0013

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0013 canonical source unit.
  - Proposed Seriousness 1 => ENDPOINT_MATCH.
  - Proposed Seriousness 2 => BOUNDED_MISS_REQUIRES_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Seriousness is 3, 4, or 5; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
