name: 17-qwen-structural-openness-adv0278-upper-endpoint-v1

purpose: >
  Expand Qwen 3.6 35B-A3B Structural Openness coverage from existing
  low-end evidence to the dominant endpoint using ADV-0278
  Witchlight Carnival.

dispatch: pool

models:
  - qwen

dimension: Structural Openness

adventures:
  - ADV-0278

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0278 canonical source unit.
  - Proposed Structural Openness 5 => ENDPOINT_MATCH.
  - Proposed Structural Openness 4 => BOUNDED_MISS_REQUIRES_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Structural Openness is 1, 2, or 3; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
