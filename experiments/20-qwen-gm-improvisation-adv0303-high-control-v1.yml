name: 20-qwen-gm-improvisation-adv0303-high-control-v1

purpose: >
  Push Qwen 3.6 35B-A3B GM Improvisation Demand coverage into the
  high range using ADV-0303 Storm King's Thunder after lower-anchor
  and midscale testing.

dispatch: pool

models:
  - qwen

dimension: GM Improvisation Demand

adventures:
  - ADV-0303

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0303 canonical source unit.
  - Proposed GM Improvisation Demand 4 => CONTROL_MATCH.
  - Proposed GM Improvisation Demand 3 or 5 => BOUNDED_MISS_REQUIRES_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed GM Improvisation Demand is 1 or 2; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned high-control run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
