name: qwen-sessions-adv0053-post-scrub-fix-v1

purpose: >
  Re-run the Phase-4 # of Sessions discriminator for ADV-0053 Call of the Wild
  after hardening AFAO target-reference scrubbing. This supersedes the earlier
  contaminated run and provides clean post-fix evidence.

dispatch: pool

models:
  - qwen

dimension: '# of Sessions'

adventures:
  - ADV-0053

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.
  - No target-specific AFAO calibration material survives into the scoring prompt.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - Target-specific calibration material is observed in the scoring context.
  - The scorer cannot complete the assessment.
