name: 01-nemotron-exploration-adv0062-discriminator-v1

purpose: >
  Test whether Nemotron-3-Nano 30B-A3B correctly places the low-Exploration
  ADV-0062 No Honour Among Thieves control after its high-side
  Exploration result on ADV-0230 Salvage Operation.

dispatch: pool

models:
  - nemotron

dimension: Exploration Emphasis

adventures:
  - ADV-0062

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0062 canonical source unit.
  - Proposed Exploration Emphasis 2 => AUDITION_SURVIVED.
  - Proposed Exploration Emphasis 1 or 3 => AUDITION_SURVIVED_WITH_BIAS.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Exploration Emphasis is 4 or 5; classify AUDITION_FAILED for this discriminator.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned discriminator run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
