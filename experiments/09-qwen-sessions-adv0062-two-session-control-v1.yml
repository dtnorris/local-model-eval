name: 09-qwen-sessions-adv0062-two-session-control-v1

purpose: >
  Test whether Qwen 3.6 35B-A3B systematically compresses short adventures
  toward one normalized session by scoring the ADV-0062 No Honour Among
  Thieves two-session control.

dispatch: pool

models:
  - qwen

dimension: "# of Sessions"

adventures:
  - ADV-0062

replicates: 1

workers:
  - mac_alt

required_worker_labels:
  - alternate-endpoint

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - The target-reference line-wrap scrubber fix is active before execution.
  - Structured output validates and is grounded to the ADV-0062 canonical source unit.
  - Normalized Sessions 2 => CONTROL_MATCH.
  - Normalized Sessions 1 or 3 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-session contamination is used in the assessment.

stop_conditions:
  - Do not execute if the target-reference line-wrap scrubber fix has not been verified.
  - Normalized Sessions is 4 or greater; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned control run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
