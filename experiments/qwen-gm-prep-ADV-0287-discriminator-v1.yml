name: qwen-gm-prep-ADV-0287-discriminator-v1
purpose: >
  Phase-4 3-to-4 boundary discriminator for Qwen GM Preparation Burden
  using ADV-0287 House of Lament. Run only if the prior GM Preparation
  discriminator did not produce a hard failure.

dispatch: pool

models:
  - qwen

dimension: GM Preparation Burden

adventures:
  - ADV-0287

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the canonical source unit.
  - Assessment remains within the exact-or-adjacent Phase-4 acceptance band.
  - No target-specific expected-score contamination is used.

stop_conditions:
  - A non-adjacent score error or serious qualitative failure occurs; classify AUDITION_FAILED for Qwen GM Preparation Burden.
  - The single planned discriminator run completes; do not add favorable reruns.

cost_cap_usd: 0.01
