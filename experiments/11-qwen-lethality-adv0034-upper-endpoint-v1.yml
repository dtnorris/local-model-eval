name: 11-qwen-lethality-adv0034-upper-endpoint-v1

purpose: >
  Test whether Qwen 3.6 35B-A3B's established downward Lethality bias
  persists at the extreme upper endpoint using ADV-0034 Tomb of Horrors.

dispatch: pool

models:
  - qwen

dimension: Lethality / Failure Severity

adventures:
  - ADV-0034

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0034 canonical source unit.
  - Proposed Lethality / Failure Severity 5 => ENDPOINT_MATCH.
  - Proposed Lethality / Failure Severity 4 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Lethality / Failure Severity is 1, 2, or 3; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
