name: 10-qwen-levels-adv0262-control-v1

purpose: >
  Test Qwen 3.6 35B-A3B on the ordinary multilevel ADV-0262
  Lost Mine of Phandelver control, avoiding alternate-start and
  unusual completion-level complications present in other cases.

dispatch: pool

models:
  - qwen

dimension: Levels

adventures:
  - ADV-0262

replicates: 1

workers:
  - mac_alt

required_worker_labels:
  - alternate-endpoint

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - The target-reference line-wrap scrubber fix is active before execution.
  - Structured output validates and is grounded to the ADV-0262 canonical source unit.
  - Proposed Level Start 1 and Level End 5 => CONTROL_MATCH.
  - A one-level error on exactly one endpoint => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-level contamination is used in the assessment.

stop_conditions:
  - Do not execute if the target-reference line-wrap scrubber fix has not been verified.
  - Either endpoint differs from the expected value by more than one level; classify as a serious discriminator failure.
  - Both endpoints are wrong, even if each is only adjacent; classify as a failed control.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned control run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
