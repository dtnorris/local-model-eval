name: 27-qwen-player-beginner-adv0034-lower-endpoint-v1

purpose: >
  Conditional follow-up to experiment 19. If Qwen survives the Lost Mine of
  Phandelver upper endpoint, test the opposite Player Beginner Suitability
  endpoint using ADV-0034 Tomb of Horrors.

dispatch: pool

models:
  - qwen

dimension: Player Beginner Suitability

adventures:
  - ADV-0034

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Experiment 19 survived its discriminator.
  - Structured output validates and is grounded to the ADV-0034 canonical source unit.
  - Proposed Player Beginner Suitability 1 => ENDPOINT_MATCH.
  - Proposed Player Beginner Suitability 2 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Do not execute if experiment 19 failed its discriminator.
  - Proposed Player Beginner Suitability is 3, 4, or 5; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
