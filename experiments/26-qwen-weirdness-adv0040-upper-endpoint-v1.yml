name: 26-qwen-weirdness-adv0040-upper-endpoint-v1

purpose: >
  Conditional follow-up to experiment 08. If Qwen survives the Witchlight
  Carnival Fantastic Weirdness control, obtain clean upper-end evidence using
  ADV-0040 Expedition to the Barrier Peaks.

dispatch: pool

models:
  - qwen

dimension: Fantastic Weirdness

adventures:
  - ADV-0040

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Experiment 08 survived its discriminator.
  - Structured output validates and is grounded to the ADV-0040 canonical source unit.
  - Proposed Fantastic Weirdness 5 => ENDPOINT_MATCH.
  - Proposed Fantastic Weirdness 4 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Do not execute if experiment 08 failed its discriminator.
  - Proposed Fantastic Weirdness is 1, 2, or 3; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
