name: 22-nemotron-tactical-adv0278-lower-endpoint-v1

purpose: >
  Conditional follow-up to the Nemotron Tactical Complexity rescue audition.
  Run only if experiment 02 survived. Test the opposite endpoint using
  ADV-0278 Witchlight Carnival.

dispatch: pool

models:
  - nemotron

dimension: Tactical Complexity

adventures:
  - ADV-0278

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Experiment 02 survived its discriminator.
  - Structured output validates and is grounded to the ADV-0278 canonical source unit.
  - Proposed Tactical Complexity 1 => ENDPOINT_MATCH.
  - Proposed Tactical Complexity 2 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Do not execute if experiment 02 failed its discriminator.
  - Proposed Tactical Complexity is 3, 4, or 5; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
