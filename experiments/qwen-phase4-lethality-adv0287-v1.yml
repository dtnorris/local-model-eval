name: qwen-phase4-lethality-adv0287-v1

purpose: >
  Run a differentiated Phase-4 Lethality / Failure Severity discriminator on ADV-0287
  using Qwen 3.6 35B-A3B.

dispatch: pool

models:
  - qwen

dimension: Lethality / Failure Severity

adventures:
  - ADV-0287

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - The scorer cannot complete the assessment.
