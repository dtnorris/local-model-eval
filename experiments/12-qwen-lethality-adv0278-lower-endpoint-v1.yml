name: 12-qwen-lethality-adv0278-lower-endpoint-v1

purpose: >
  Test Qwen 3.6 35B-A3B at the forgiving Lethality endpoint using
  ADV-0278 Witchlight Carnival to distinguish global downward bias
  from mid-ladder compression.

dispatch: pool

models:
  - qwen

dimension: Lethality / Failure Severity

adventures:
  - ADV-0278

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0278 canonical source unit.
  - Proposed Lethality / Failure Severity 1 => ENDPOINT_MATCH.
  - Proposed Lethality / Failure Severity 2 => BOUNDED_MISS_REQUIRES_BIAS_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Lethality / Failure Severity is 3, 4, or 5; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
