name: qwen-phase4-player-beginner-adv0062-v1

purpose: >
  Run a differentiated Phase-4 Player Beginner Suitability discriminator on ADV-0062
  using Qwen 3.6 35B-A3B.

dispatch: pool

models:
  - qwen

dimension: Player Beginner Suitability

adventures:
  - ADV-0062

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - The scorer cannot complete the assessment.
