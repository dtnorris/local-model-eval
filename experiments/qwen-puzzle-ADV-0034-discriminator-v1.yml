name: qwen-puzzle-ADV-0034-discriminator-v1
purpose: >
  Phase-4 upper-end Qwen discriminator for Puzzle / Problem-Solving Emphasis
  using ADV-0034 Tomb of Horrors. Run only if the prior Puzzle discriminator
  did not produce a hard failure.

dispatch: pool

models:
  - qwen

dimension: Puzzle / Problem-Solving Emphasis

adventures:
  - ADV-0034

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the canonical source unit.
  - Assessment remains within the exact-or-adjacent Phase-4 acceptance band.
  - No target-specific expected-score contamination is used.

stop_conditions:
  - A non-adjacent score error or serious qualitative failure occurs; classify AUDITION_FAILED for Qwen Puzzle / Problem-Solving Emphasis.
  - The single planned discriminator run completes; do not add favorable reruns.

cost_cap_usd: 0.01
