name: 15-qwen-combat-adv0277-lower-endpoint-v1

purpose: >
  Expand Qwen 3.6 35B-A3B Combat Emphasis coverage to the opposite
  end of the scale using ADV-0277 The Wild Beyond the Witchlight
  after successful upper-end Combat evidence.

dispatch: pool

models:
  - qwen

dimension: Combat Emphasis

adventures:
  - ADV-0277

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0277 canonical source unit.
  - Proposed Combat Emphasis 1 => ENDPOINT_MATCH.
  - Proposed Combat Emphasis 2 => BOUNDED_MISS_REQUIRES_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Combat Emphasis is 3, 4, or 5; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
