name: qwen-gm-beginner-adv0287-upper-control-v2

purpose: >
  Close the remaining Qwen GM Beginner Suitability scale-breadth gap with the
  calibrated score-5 ADV-0287 House of Lament endpoint. This v2 removes the
  stale dependency on the failed mac_alt ADV-0034 attempt.

dispatch: pool

models:
  - qwen

dimension: GM Beginner Suitability

adventures:
  - ADV-0287

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0287 canonical source unit.
  - Proposed GM Beginner Suitability 5 => ENDPOINT_MATCH.
  - Proposed GM Beginner Suitability 4 => BOUNDED_MISS_REQUIRES_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed GM Beginner Suitability is 1, 2, or 3; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
