name: nemotron-phase4-exploration-adv0230-v1

purpose: >
  Run the Phase-4 Exploration Emphasis rescue discriminator on ADV-0230
  using Nemotron-3-Nano 30B-A3B after Qwen's hard failure on the same case.

dispatch: pool

models:
  - nemotron

dimension: Exploration Emphasis

adventures:
  - ADV-0230

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded and uses the correct canonical adventure unit.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - The scorer cannot complete the assessment.
