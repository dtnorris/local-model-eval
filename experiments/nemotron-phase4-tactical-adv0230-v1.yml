name: nemotron-phase4-tactical-adv0230-v1

purpose: >
  Run a differentiated second Phase-4 Tactical Complexity discriminator on
  ADV-0230 Salvage Operation using Nemotron-3-Nano 30B-A3B after its first
  Tactical Complexity discriminator on ADV-0189.

dispatch: pool

models:
  - nemotron

dimension: Tactical Complexity

adventures:
  - ADV-0230

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - One valid structured assessment completes.
  - The assessment is source-grounded.
  - The scorer evaluates the correct canonical adventure unit.
  - No target-specific calibration material is used as evidence.

stop_conditions:
  - Structured output fails.
  - Source grounding fails.
  - The wrong canonical adventure unit is assessed.
  - Target-specific calibration material is observed in the scoring context.
  - The scorer cannot complete the assessment.
