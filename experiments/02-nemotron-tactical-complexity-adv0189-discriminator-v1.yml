name: 02-nemotron-tactical-complexity-adv0189-discriminator-v1

purpose: >
  Test whether Nemotron-3-Nano 30B-A3B can recover the ADV-0189
  Tockworth's Clockworks Tactical Complexity discriminator that produced
  a serious Qwen miss.

dispatch: pool

models:
  - nemotron

dimension: Tactical Complexity

adventures:
  - ADV-0189

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0189 canonical source unit.
  - Proposed Tactical Complexity 4 => AUDITION_SURVIVED.
  - Proposed Tactical Complexity 3 or 5 => AUDITION_SURVIVED_WITH_BIAS.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Tactical Complexity is 1 or 2; classify AUDITION_FAILED and do not deepen Nemotron Tactical Complexity testing yet.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned discriminator run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
