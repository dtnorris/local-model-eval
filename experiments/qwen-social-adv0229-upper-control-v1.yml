name: qwen-social-adv0229-upper-control-v1

purpose: >
  Close the remaining Qwen Social Interaction Emphasis audition gap with the
  calibrated score-5 ADV-0229 Danger at Dunwater endpoint. Current clean Qwen
  evidence is concentrated at the low end.

dispatch: pool

models:
  - qwen

dimension: Social Interaction Emphasis

adventures:
  - ADV-0229

replicates: 1

workers:
  - mac

scorer:
  repo: ../../af-cli-scoring-utility
  mode: positional
  extra_args: []

success_criteria:
  - Structured output validates and is grounded to the ADV-0229 canonical source unit.
  - Proposed Social Interaction Emphasis 5 => ENDPOINT_MATCH.
  - Proposed Social Interaction Emphasis 4 => BOUNDED_MISS_REQUIRES_REVIEW.
  - No target-specific expected-score contamination is used in the assessment.

stop_conditions:
  - Proposed Social Interaction Emphasis is 1, 2, or 3; classify as a serious discriminator failure.
  - Structured-output failure, serious grounding failure, wrong canonical unit, or other qualitative failure occurs.
  - The single planned endpoint run completes; do not add reruns to seek a more favorable result.

cost_cap_usd: 0.01
